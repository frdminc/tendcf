# Example instance — validates against schema/launchd-writers.schema.json.
# Fixture, not site data (D21).
#
# One writer per label prefix or exact label. bin/schema_lint.py rejects
# overlapping prefixes or an exact label under a prefix: two writers over one
# namespace is the exact hazard this file prevents.

contract_version: 2

domain:
  description: "The launchd label namespace on macOS"
  # comprehensive defaults to true: a loaded job matching no declared prefix
  # or exact label is an extra entry.

writers:
  - prefix: com.djbclark.*
    writer: cfengine
    repo: site-shared
    note: "Site services. Rendered from services.yml via nix2cf."

  - prefix: com.tendcf.example.*
    writer: cfengine
    repo: tendcf
    note: "Engine-owned example services. Fixture only."

  - prefix: org.tendcf.*
    writer: cfengine
    repo: tendcf
    note: "tendcf's own root cf-execd LaunchDaemon installed by deploy/darwin/tendcf-install.sh."

  - prefix: dev.mise.*
    writer: mise
    note: "Toolchain shims only; mise does not own services (D13)."

  - prefix: org.nixos.*
    writer: nix-darwin
    note: "Substrate only, and only if map §14.1 resolves toward nix-darwin (Step 7)."

  - prefix: com.apple.*
    writer: apple
    note: "Not ours. Declared so it is not reported as an extra entry."
