name: Linux

# Builds the CFEngine fork pinned in overlay/fork.json on every Linux target
# of docs/architecture/linux-targets.md §1 that CI can reach (T1: GitHub
# ubuntu VMs, x86_64 plus one arm64 row; T2: a debian:13 container matching
# pastebin, T3), and runs the generic-bundle tests (tests/policy/run.sh) on
# the result. The debian:13 install tree is uploaded for the T3 dry-run.
#
# Hosted ubuntu runners are full VMs with systemd as PID 1, so the systemd
# branch of the bundle (linux-targets.md §3 step 5) runs in enforce mode
# there (TENDCF_TEST_SYSTEMD=1, passwordless sudo). The debian:13 container
# has no systemd manager, so it covers the refusal path instead. Explicit
# runner labels, not ubuntu-latest, since that label moves (26.04 from
# November 2026).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # The install tree is built at its final, root-owned prefix: the
      # binaries' runtime library path is then a directory only root can
      # write, which deploy/linux/tendcf-install.sh requires on a host.
      - name: Build prefix
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/tendcf
      - uses: ./.github/actions/build-fork
        with:
          prefix: /opt/tendcf
      - name: Generic-bundle tests (systemd lifecycle in enforce mode)
        env:
          TENDCF_TEST_SYSTEMD: "1"
        run: tests/policy/run.sh --bindir /opt/tendcf/bin
      # linux-targets.md step 7: the canonical root-owned install and a root
      # cf-execd, with the canary service, on a real systemd manager. After
      # the policy tests: it takes over /var/cfengine.
      - name: Root-owned install, cf-execd and canary (step 7)
        run: tests/deploy/linux-install.sh

  debian-13:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      # The image has no git or python; the composite action needs both
      # before checkout can even use git. fakeroot is testall's default
      # gainroot (the ubuntu images ship it); procps gives the unit tests
      # the `ps` they shell out to.
      - name: Container prerequisites
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates python3 sudo fakeroot procps
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-fork
        with:
          prefix: /opt/tendcf
      - name: Generic-bundle tests
        run: tests/policy/run.sh --bindir /opt/tendcf/bin
      # librsync (and its libb2) is a build-time pick of core's configure
      # and not part of a minimal Debian; pastebin lacked it (2026-10-29).
      # Everything else cf-agent links is in the Debian base. The tree is
      # built for /opt/tendcf (a root-owned runtime library path), so it is
      # extracted there as root; it carries the policy, the canary data and
      # the installer (share/tendcf) so one artifact is the whole deploy.
      - name: Package the install tree for pastebin (T3)
        run: |
          cp -P /usr/lib/$(uname -m)-linux-gnu/librsync.so.2* /usr/lib/$(uname -m)-linux-gnu/libb2.so.1* /opt/tendcf/lib/
          mkdir -p /opt/tendcf/share/tendcf
          cp -R policy deploy /opt/tendcf/share/tendcf/
          echo "$GITHUB_SHA" > /opt/tendcf/share/tendcf/REVISION
          tar -C /opt -czf /tmp/cfengine-fork-debian13-$(uname -m).tar.gz tendcf
      # After packaging, because the test removes the system librsync/libb2
      # and needs the bundled copies already in the tree. It reinstalls over
      # /opt/tendcf, which the tarball above no longer depends on.
      - name: Bare-host install (no system librsync/libb2)
        run: tests/deploy/bare-host-libs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cfengine-fork-debian13
          path: /tmp/cfengine-fork-debian13-*.tar.gz
          retention-days: 14
