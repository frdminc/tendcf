name: Unit classifier S1 (branch iteration)
on:
  push:
    branches: [v5-s1-classifier]
permissions:
  contents: read
jobs:
  vm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: openssh-server (real units for the ssh.service rows)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends openssh-server
      - name: S1 probe (spec 3.5)
        run: sudo -E env TENDCF_TEST_SYSTEMD=1 python3 tests/unit_classifier/s1_probe.py | tee /tmp/s1-probe.md
      - uses: actions/upload-artifact@v4
        with:
          name: s1-probe-${{ matrix.runner }}
          path: /tmp/s1-probe.md
