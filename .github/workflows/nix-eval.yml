# Proves the restricted Nix evaluation invocation documented in
# docs/architecture/plugin-layout.md ("Frontend inputs are code", item 3)
# against fixtures in tests/nix/. It evaluates only; it never builds a package.
name: nix-eval

on:
  push:
    branches: [master]
    paths: ["tests/nix/**", ".github/workflows/nix-eval.yml"]
  pull_request:
    paths: ["tests/nix/**", ".github/workflows/nix-eval.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Nix version and relevant settings
        run: |
          nix --version
          nix-instantiate --version
          nix show-config | grep -E '^(restrict-eval|allowed-uris|allow-import-from-derivation|pure-eval|allow-unsafe-native-code-during-evaluation|sandbox|trusted-users) '
      - name: Documented invocation (gating, fresh store)
        run: python3 tests/nix/run_nix_eval.py check base+I
      - name: Matrix of variants and controls (informational; shows why -I is needed and that pure-eval fails; its read-write control leaves a .drv in the store)
        run: python3 tests/nix/run_nix_eval.py matrix
      - name: Documented invocation again (gating, populated store)
        run: python3 tests/nix/run_nix_eval.py check base+I
