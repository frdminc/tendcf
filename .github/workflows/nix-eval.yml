# Proves the restricted Nix evaluation invocation documented in
# docs/architecture/plugin-layout.md ("Frontend inputs are code", item 3)
# against fixtures in tests/nix/. It evaluates only; it never builds a package.
name: nix-eval

on:
  push:
    branches: [master, "docs/d46-issue48-decisions"]
    paths: ["tests/nix/**", ".github/workflows/nix-eval.yml"]
  pull_request:
    paths: ["tests/nix/**", ".github/workflows/nix-eval.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Nix version and relevant settings
        run: |
          nix --version
          nix-instantiate --version
          nix show-config | grep -E '^(restrict-eval|allowed-uris|allow-import-from-derivation|pure-eval|allow-unsafe-native-code-during-evaluation|sandbox|trusted-users) '
      - name: Matrix of variants and controls (informational)
        run: python3 tests/nix/run_nix_eval.py matrix
      - name: IFD debugging (informational)
        continue-on-error: true
        run: |
          export NIX_PATH=
          d=tests/nix/fixtures/negative
          echo "--- default options"
          nix-instantiate --eval --strict --json $d/ifd.nix 2>&1 | tail -3 || true
          echo "--- IFD true, sandbox false"
          nix-instantiate --eval --strict --json --option allow-import-from-derivation true --option sandbox false $d/ifd.nix 2>&1 | tail -3 || true
          echo "--- IFD false, sandbox false, no restrict-eval"
          nix-instantiate --eval --strict --json --option allow-import-from-derivation false $d/ifd.nix 2>&1 | tail -3 || true
          echo "--- instantiate only (does the .drv get written?)"
          nix-instantiate $d/ifd.nix 2>&1 | tail -3 || true
          echo "--- readFile style, IFD false"
          cat > $RUNNER_TEMP/ifd2.nix <<'NIX'
          let d = derivation { name = "ifd2"; system = builtins.currentSystem; builder = "/bin/sh"; args = [ "-c" "echo 1 > $out" ]; };
          in builtins.readFile d
          NIX
          nix-instantiate --eval --strict --json --option allow-import-from-derivation false --option sandbox false $RUNNER_TEMP/ifd2.nix 2>&1 | tail -3 || true
          echo "--- readFile style, IFD true, sandbox false"
          nix-instantiate --eval --strict --json --option allow-import-from-derivation true --option sandbox false $RUNNER_TEMP/ifd2.nix 2>&1 | tail -3 || true
